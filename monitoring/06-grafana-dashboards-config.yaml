apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Chaos Engineering Dashboards'
        orgId: 1
        folder: 'Chaos Mesh & Resilience'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
