apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-loss-currencyservice
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: chaos-engineering-platform
    chaos.tier: financial
    experiment.type: network-chaos
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: currencyservice
  loss:
    loss: '30'
    correlation: '25'
  direction: to
  duration: 60s
