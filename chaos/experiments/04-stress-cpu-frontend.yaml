apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: stress-cpu-frontend
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: chaos-engineering-platform
    chaos.tier: frontend
    experiment.type: stress-chaos
spec:
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: frontend
  stressors:
    cpu:
      workers: 2
      load: 85
      options:
        - '--cpu 2'
        - '--timeout 60s'
  duration: 60s
