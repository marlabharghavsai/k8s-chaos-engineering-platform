  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: chaos-engineering-platform
    chaos.tier: frontend
    experiment.type: pod-chaos
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: frontend
  duration: 60s
